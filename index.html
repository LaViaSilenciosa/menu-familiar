<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mesa Familiar · Menú de Verano</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1A4A2E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Menú Familiar" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-dark: #1A4A2E;
      --green-mid:  #2D7A4F;
      --cream:      #FDFAF5;
      --cream2:     #F5EDD8;
      --gold:       #C8A86A;
      --brown:      #6B5A3A;
      --text:       #2C2410;
      --text2:      #3A2E1A;
      --muted:      #9A8A6A;
      --lunes:      #4A7C59;
      --martes:     #2E6B8A;
      --miercoles:  #7B4F2E;
      --jueves:     #5E4A7C;
      --viernes:    #8A5C2E;
      --sabado:     #7C2E4A;
    }
    body { font-family: Georgia, serif; background: var(--cream); color: var(--text); min-height: 100dvh; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
      padding: max(env(safe-area-inset-top), 28px) 20px 22px;
      text-align: center; color: var(--cream2);
    }
    .header-eyebrow { font-family: sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; opacity: .7; margin-bottom: 6px; }
    .header h1 { font-size: clamp(20px, 6vw, 30px); font-weight: 700; letter-spacing: -.5px; }
    .header-sub { font-family: sans-serif; font-size: 12px; opacity: .6; margin-top: 5px; }
    .header-hint { font-family: sans-serif; font-size: 11px; opacity: .5; margin-top: 4px; }

    /* ── WEEK TABS ── */
    .week-tabs { display: flex; gap: 4px; padding: 14px 14px 0; overflow-x: auto; background: var(--cream2); border-bottom: 1px solid #DDD0B8; scrollbar-width: none; }
    .week-tabs::-webkit-scrollbar { display: none; }
    .week-tab {
      flex-shrink: 0; padding: 7px 14px; border-radius: 6px 6px 0 0;
      font-family: sans-serif; font-size: 12px; font-weight: 600;
      color: var(--brown); transition: background .2s, color .2s;
    }
    .week-tab.active { background: var(--green-dark); color: var(--cream2); }

    /* ── GRID ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; padding: 14px; }
    .day-card {
      background: #fff; border: 2px solid transparent; border-radius: 12px;
      padding: 14px 12px; text-align: left; transition: transform .15s, box-shadow .15s;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .day-card:active { transform: scale(.98); }
    .day-badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-family: sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: #fff; margin-bottom: 10px;
    }
    .card-label { font-family: sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; margin-top: 8px; }
    .card-label:first-of-type { margin-top: 0; }
    .card-dish { font-size: 12px; color: var(--text2); line-height: 1.4; }
    .card-arrow { font-family: sans-serif; font-size: 10px; text-align: right; margin-top: 10px; }

    /* ── DETAIL ── */
    .detail { padding: 14px; max-width: 600px; margin: 0 auto; }
    .back-btn {
      border: 1px solid #C8B89A; border-radius: 6px; padding: 6px 12px;
      font-family: sans-serif; font-size: 12px; color: var(--brown); margin-bottom: 16px;
    }
    .day-title-badge {
      display: inline-block; padding: 4px 14px; border-radius: 20px;
      font-family: sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: #fff; margin-bottom: 10px;
    }
    .detail-hint { font-family: sans-serif; font-size: 11px; color: var(--muted); margin-bottom: 14px; }
    .meal-block { border-radius: 14px; padding: 18px; margin-bottom: 14px; }
    .meal-block-label { font-family: sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--brown); margin-bottom: 14px; }
    .dish-btn {
      display: flex; gap: 10px; align-items: flex-start;
      width: 100%; text-align: left; background: #fff;
      border: 1px solid rgba(0,0,0,.07); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px; transition: border-color .15s, background .15s;
    }
    .dish-btn:active { background: #FFFDF7; border-color: var(--gold); }
    .dish-emoji { font-size: 18px; line-height: 1; flex-shrink: 0; }
    .dish-info { flex: 1; }
    .dish-role { font-family: sans-serif; font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
    .dish-name { font-size: 14px; color: var(--text); line-height: 1.4; }
    .dish-icon { font-size: 12px; color: var(--gold); align-self: center; flex-shrink: 0; }
    .day-nav { display: flex; gap: 8px; margin-top: 6px; }
    .day-nav-btn { flex: 1; padding: 10px; background: #fff; border: 1px solid #DDD0B8; border-radius: 8px; font-family: sans-serif; font-size: 12px; color: var(--brown); }

    /* ── MODAL ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(20,14,6,.65);
      z-index: 1000; display: flex; align-items: flex-end; justify-content: center;
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    }
    .modal-sheet {
      background: var(--cream); border-radius: 20px 20px 0 0;
      width: 100%; max-width: 640px;
      max-height: 88dvh; overflow-y: auto;
      padding: 0 20px max(env(safe-area-inset-bottom), 32px);
      box-shadow: 0 -8px 40px rgba(0,0,0,.25);
    }
    .modal-handle-wrap { position: sticky; top: 0; background: var(--cream); padding: 14px 0 4px; }
    .modal-handle { width: 40px; height: 4px; background: #DDD0B8; border-radius: 4px; margin: 0 auto; }
    .modal-eyebrow { font-family: sans-serif; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 12px 0 5px; }
    .modal-title { font-size: 19px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 18px; }
    .modal-time { display: inline-flex; align-items: center; gap: 5px; background: #F0F8EC; border-radius: 20px; padding: 5px 14px; font-family: sans-serif; font-size: 12px; color: #4A7C59; font-weight: 600; margin-bottom: 18px; }
    .section-label { font-family: sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--brown); text-transform: uppercase; margin-bottom: 10px; }
    .ingredient-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .ingredient-item { display: flex; align-items: baseline; gap: 8px; font-size: 14px; color: var(--text2); line-height: 1.4; }
    .ingredient-dot { color: var(--gold); font-size: 16px; flex-shrink: 0; }
    .steps-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .step-item { display: flex; gap: 12px; align-items: flex-start; }
    .step-num {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
      background: var(--green-dark); color: var(--cream2);
      display: flex; align-items: center; justify-content: center;
      font-family: sans-serif; font-size: 11px; font-weight: 700;
    }
    .step-text { font-size: 14px; color: var(--text2); line-height: 1.6; }
    .tip-box { background: #FDF6E8; border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; padding: 12px 14px; margin-bottom: 20px; }
    .tip-label { font-family: sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #9A7A3A; text-transform: uppercase; margin-bottom: 4px; }
    .tip-text { font-size: 13px; color: #5A4A2A; line-height: 1.5; }
    .modal-close { width: 100%; padding: 13px; background: var(--green-dark); color: var(--cream2); border-radius: 10px; font-family: sans-serif; font-size: 14px; font-weight: 600; }
    .loading-box { text-align: center; padding: 50px 0; font-family: sans-serif; color: var(--muted); }
    .loading-emoji { font-size: 30px; margin-bottom: 10px; }

    /* ── FOOTER ── */
    .footer { text-align: center; padding: 22px 16px; font-family: sans-serif; font-size: 10px; color: #B0A080; border-top: 1px solid #E8DEC8; margin-top: 10px; }
  </style>
</head>
<body>

<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════
//  DATOS: MENÚ + RECETAS
// ═══════════════════════════════════════════════════════
const RECETAS = {
  "Gazpacho andaluz con tropezones": {
    tiempo: "15 min + 1h frío",
    ingredientes: ["1 kg de tomates maduros", "1 pepino mediano", "1 pimiento verde", "1 diente de ajo", "80 ml de aceite de oliva virgen extra", "30 ml de vinagre de jerez", "Sal al gusto"],
    pasos: [
      "Lava y trocea los tomates, el pepino pelado, el pimiento y el ajo. Reserva un poco de cada uno picado fino para los tropezones.",
      "Tritura todo junto con el aceite, el vinagre y sal. Añade agua fría hasta conseguir la textura deseada.",
      "Pasa por el chino o colador fino para eliminar pieles y pepitas.",
      "Rectifica de sal y vinagre. Mete en la nevera mínimo 1 hora.",
      "Sirve muy frío con los tropezones de verdura picada por encima y un chorrito de aceite."
    ],
    consejo: "Si los tomates no están muy maduros, añade un tomate pera de bote al natural para potenciar el sabor."
  },
  "Merluza al horno con patatas panaderas": {
    tiempo: "50 min",
    ingredientes: ["800g de merluza en rodajas o lomos", "600g de patatas", "2 cebollas", "3 dientes de ajo", "Pimiento rojo y verde (1 de cada)", "100 ml de vino blanco", "Aceite, sal, perejil"],
    pasos: [
      "Pela y corta las patatas en rodajas finas. Haz lo mismo con las cebollas y los pimientos.",
      "Sofríe a fuego lento la cebolla y los pimientos en abundante aceite durante 15 minutos. Añade las patatas y cocina 10 minutos más.",
      "Coloca las patatas y verduras como base en una fuente de horno. Coloca la merluza encima, salpimenta.",
      "Vierte el vino blanco, espolvorea ajo picado y perejil. Riega con un chorrito de aceite.",
      "Hornea a 200°C durante 20-25 minutos hasta que el pescado esté hecho y las patatas tiernas."
    ],
    consejo: "Si usas lomos sin espinas es ideal para el niño. Pide en la pescadería que te los preparen así."
  },
  "Ensalada de tomate y pepino con orégano": {
    tiempo: "10 min",
    ingredientes: ["4 tomates de rama maduros", "1 pepino", "1/2 cebolla morada", "Orégano seco", "Aceite de oliva virgen extra", "Sal y vinagre de manzana"],
    pasos: [
      "Lava los tomates y córtalos en rodajas o gajos según prefieras.",
      "Pela el pepino, córtalo por la mitad a lo largo y luego en medias lunas.",
      "Pela la cebolla y córtala en juliana muy fina. Si es muy fuerte, remójala 10 min en agua fría.",
      "Mezcla todo en una fuente. Aliña con sal, vinagre, aceite generoso y orégano al gusto."
    ],
    consejo: "Déjala reposar 10 minutos antes de servir para que los tomates suelten su jugo y se mezcle con el aliño."
  },
  "Tortilla española con pimientos asados": {
    tiempo: "35 min",
    ingredientes: ["6 huevos", "600g de patatas", "1 cebolla", "2 pimientos rojos asados (del tarro o caseros)", "Aceite de oliva", "Sal"],
    pasos: [
      "Pela y corta las patatas en láminas finas. Pica la cebolla. Fríe todo junto en abundante aceite a fuego medio-bajo 20 min hasta que estén tiernas. Escurre el aceite.",
      "Bate los huevos con sal. Añade las patatas y cebolla escurridas. Mezcla y deja reposar 5 min.",
      "Calienta un poco de aceite en la sartén. Vierte la mezcla y cuaja a fuego medio-bajo con tapa.",
      "Cuando los bordes estén cuajados, da la vuelta con un plato y termina de cuajar por el otro lado 2-3 min.",
      "Sirve con los pimientos asados cortados en tiras por encima."
    ],
    consejo: "La clave de una buena tortilla es paciencia: fuego bajo y sin prisas. Que quede jugosa por dentro."
  },
  "Crema fría de pepino y menta": {
    tiempo: "15 min + 1h frío",
    ingredientes: ["3 pepinos grandes", "300g de yogur griego", "1 diente de ajo pequeño", "Hojas de menta fresca", "Zumo de 1 limón", "Aceite de oliva, sal"],
    pasos: [
      "Pela los pepinos, reserva unos trozos para decorar y trocea el resto.",
      "Tritura los pepinos con el yogur, el ajo, el zumo de limón, menta al gusto y sal.",
      "Añade un chorrito de aceite y vuelve a triturar. Ajusta de sal y limón.",
      "Refrigera al menos 1 hora. Sirve con pepino picado, hojas de menta y aceite por encima."
    ],
    consejo: "Si queda muy espesa añade un poco de agua fría. Si es muy intensa de ajo, retíralo antes de triturar y pon solo medio."
  },
  "Pollo a la plancha con judías verdes salteadas": {
    tiempo: "25 min",
    ingredientes: ["4 pechugas o contramuslos de pollo", "500g de judías verdes frescas", "3 dientes de ajo", "Zumo de 1 limón", "Aceite de oliva, sal, pimienta, pimentón"],
    pasos: [
      "Salpimienta el pollo y marina 10 min con zumo de limón, ajo machacado y pimentón.",
      "Cuece las judías verdes en agua con sal 8-10 minutos. Escurre y reserva.",
      "Cocina el pollo en la plancha caliente con un poco de aceite, 5-6 min por cada lado según el grosor.",
      "En la misma sartén, saltea las judías con ajo laminado 3-4 minutos. Salpimenta."
    ],
    consejo: "Para que el pollo quede jugoso, no lo aplastes contra la plancha y déjalo reposar 2 minutos antes de servir."
  },
  "Pisto manchego": {
    tiempo: "40 min",
    ingredientes: ["2 calabacines", "1 berenjena", "2 pimientos (1 rojo, 1 verde)", "4 tomates maduros", "1 cebolla", "3 dientes de ajo", "Aceite de oliva, sal, azúcar"],
    pasos: [
      "Corta todas las verduras en dados pequeños y uniformes.",
      "Sofríe la cebolla y el ajo en aceite a fuego medio 5 minutos. Añade los pimientos y cocina 5 min más.",
      "Incorpora la berenjena y el calabacín. Cocina 10 minutos removiendo de vez en cuando.",
      "Añade el tomate rallado o triturado. Pon una pizca de azúcar para corregir la acidez. Salpimenta.",
      "Cocina a fuego lento 20 minutos hasta que todo esté tierno y el líquido reducido."
    ],
    consejo: "Está mejor de un día para otro. Puedes hacer doble cantidad y usarlo el día siguiente con huevo, en pasta o como guarnición."
  },
  "Huevos revueltos con champiñones": {
    tiempo: "15 min",
    ingredientes: ["6 huevos", "400g de champiñones frescos", "2 dientes de ajo", "Perejil fresco", "Aceite de oliva, sal, pimienta"],
    pasos: [
      "Limpia los champiñones y córtalos en láminas. Pica el ajo y el perejil.",
      "Saltea los champiñones con el ajo en aceite a fuego vivo hasta que suelten el agua y se doren. Salpimenta.",
      "Bate los huevos ligeramente con sal. Baja el fuego al mínimo.",
      "Añade los huevos a los champiñones y remueve con cuchara de madera sin parar hasta que cuajen cremosos.",
      "Retira del fuego antes de que estén del todo cuajados (el calor residual termina la cocción). Espolvorea perejil."
    ],
    consejo: "El secreto de los revueltos cremosos es fuego muy bajo y no dejar de mover. Retirarlos antes de que parezcan hechos del todo."
  },
  "Ensaladilla rusa casera": {
    tiempo: "40 min",
    ingredientes: ["500g de patatas", "3 zanahorias", "200g de guisantes frescos o congelados", "4 huevos", "200g de atún en aceite", "250g de mayonesa casera o de calidad"],
    pasos: [
      "Cuece las patatas y las zanahorias con piel en agua con sal hasta que estén tiernas (20-25 min). Cuece también los huevos 10 min.",
      "Deja enfriar todo. Pela y corta las patatas y zanahorias en dados pequeños. Pica los huevos.",
      "Cuece los guisantes 5 minutos si son frescos. Escúrrelos.",
      "Mezcla patatas, zanahorias, guisantes, huevo picado y atún escurrido.",
      "Añade la mayonesa, mezcla con cuidado y refrigera al menos 1 hora antes de servir."
    ],
    consejo: "Cuece las patatas enteras y con piel: absorben menos agua y quedan más sabrosas. Pela en caliente con cuidado."
  },
  "Solomillo de cerdo a la plancha con escalivada": {
    tiempo: "45 min",
    ingredientes: ["600g de solomillo de cerdo", "2 pimientos rojos", "1 berenjena grande", "1 cebolla grande", "Aceite de oliva, sal, ajo, perejil"],
    pasos: [
      "Para la escalivada: asa los pimientos, la berenjena y la cebolla enteros en el horno a 200°C durante 35-40 min, dándoles la vuelta a mitad.",
      "Mete las verduras asadas en una bolsa de plástico 10 min (el vapor facilita pelarlas). Pélalas y córtalas en tiras.",
      "Aliña la escalivada con aceite, sal y ajo picado. Reserva.",
      "Corta el solomillo en medallones de 2 cm. Salpimienta y cocina en plancha muy caliente 2-3 min por lado.",
      "Sirve los medallones sobre la escalivada con perejil picado."
    ],
    consejo: "La escalivada está mejor templada o a temperatura ambiente, nunca fría de nevera. Puedes prepararla la víspera."
  },
  "Caldo de verduras ligero": {
    tiempo: "45 min",
    ingredientes: ["2 zanahorias", "2 ramas de apio", "1 puerro", "1 cebolla", "1 tomate maduro", "Perejil, laurel, sal"],
    pasos: [
      "Lava y trocea todas las verduras en piezas grandes.",
      "Pon todo en una olla con 2 litros de agua fría. Añade las hierbas y sal.",
      "Lleva a ebullición, baja el fuego y cocina a fuego lento 40 minutos.",
      "Cuela el caldo. Sirve caliente con un chorrito de aceite de oliva crudo."
    ],
    consejo: "Congela el caldo en porciones individuales para tener siempre a mano. Aguanta 3-4 días en nevera."
  },
  "Bonito encebollado con tomate": {
    tiempo: "35 min",
    ingredientes: ["600g de bonito fresco en rodajas", "3 cebollas grandes", "4 tomates maduros", "2 dientes de ajo", "Aceite de oliva, sal, pimentón dulce, laurel"],
    pasos: [
      "Pica las cebollas en juliana fina. Sofríe a fuego bajo en aceite con laurel durante 20 minutos hasta que estén muy tiernas y doradas.",
      "Añade el ajo picado y el tomate rallado. Cocina 10 minutos más. Salpimenta y añade una pizca de pimentón.",
      "Salpimienta el bonito. En otra sartén con un poco de aceite, marca 1 minuto por lado.",
      "Añade el bonito a la salsa de cebolla y tomate. Cocina 5 minutos a fuego suave."
    ],
    consejo: "No pases demasiado el bonito: en el centro debe quedar ligeramente rosado para que no quede seco."
  },
  "Salmorejo cordobés con jamón y huevo duro": {
    tiempo: "20 min + 1h frío",
    ingredientes: ["1 kg de tomates maduros", "200g de pan del día anterior", "1 diente de ajo", "100 ml de aceite de oliva virgen extra", "2 cucharadas de vinagre de jerez", "Sal, jamón serrano y 2 huevos duros para decorar"],
    pasos: [
      "Remoja el pan en agua 5 minutos. Escurre bien apretando con las manos.",
      "Tritura los tomates con el pan, el ajo, el vinagre y la sal hasta obtener una crema fina.",
      "Sin parar la batidora, añade el aceite poco a poco en hilo fino para emulsionar. Debe quedar espeso y brillante.",
      "Pasa por el chino si lo quieres más fino. Refrigera al menos 1 hora.",
      "Sirve con jamón picado fino y huevo duro rallado por encima."
    ],
    consejo: "La calidad del tomate es fundamental. Usa tomates de rama muy maduros o tomates de colgar. En invierno añade un tomate en conserva."
  },
  "Lentejas estofadas con verduras de verano": {
    tiempo: "50 min",
    ingredientes: ["400g de lentejas pardinas", "1 cebolla, 2 zanahorias, 1 pimiento verde", "3 dientes de ajo", "2 tomates maduros", "Pimentón dulce, comino, laurel, aceite, sal"],
    pasos: [
      "Enjuaga las lentejas. En una olla, sofríe la cebolla, el pimiento y el ajo picados en aceite 8 minutos.",
      "Añade el tomate rallado y cocina 5 min. Incorpora las zanahorias en dados, el pimentón y el comino.",
      "Añade las lentejas y el laurel. Cubre con agua o caldo y lleva a ebullición.",
      "Cocina a fuego medio-bajo 30-35 minutos hasta que las lentejas estén tiernas. Ajusta de agua si es necesario.",
      "Salpimenta al final. Sirve con un chorrito de aceite crudo."
    ],
    consejo: "La sal siempre al final de la cocción, si la añades antes las lentejas pueden quedar duras."
  },
  "Ensalada mixta con atún y maíz": {
    tiempo: "10 min",
    ingredientes: ["1 lechuga romana o iceberg", "2 tomates", "1 pepino", "200g de atún en aceite de oliva", "100g de maíz dulce", "Aceitunas, aceite, vinagre, sal"],
    pasos: [
      "Lava y seca bien la lechuga. Córtala en trozos.",
      "Trocea los tomates y el pepino. Escurre el atún y el maíz.",
      "Mezcla todo en una ensaladera. Añade las aceitunas.",
      "Aliña con sal, vinagre y aceite generoso justo antes de servir."
    ],
    consejo: "Aliña siempre en el último momento para que la lechuga no se ablande."
  },
  "Pizza casera de verduras": {
    tiempo: "30 min + 1h reposo masa",
    ingredientes: ["Para la masa: 300g de harina, 7g de levadura seca, 180ml de agua tibia, sal, aceite", "Tomate frito casero", "Mozarela fresca", "Verduras al gusto: pimiento, calabacín, cebolla, champiñones"],
    pasos: [
      "Mezcla la harina con la levadura y una pizca de sal. Añade el agua tibia y 2 cucharadas de aceite. Amasa 10 minutos hasta obtener una masa lisa. Deja reposar tapada 1 hora.",
      "Estira la masa en la bandeja del horno con un poco de aceite. Deja los bordes un poco más gruesos.",
      "Unta tomate frito por encima. Distribuye las verduras cortadas finas y la mozarela en trozos.",
      "Hornea a 240°C (máxima potencia) 12-15 minutos hasta que los bordes estén dorados."
    ],
    consejo: "Precalienta el horno al máximo al menos 20 minutos antes. El calor intenso es la clave de una pizza crujiente."
  },
  "Vichyssoise fría": {
    tiempo: "30 min + 2h frío",
    ingredientes: ["4 puerros (la parte blanca)", "3 patatas medianas", "1 cebolla", "700ml de caldo de verduras", "200ml de nata líquida", "Aceite, sal, cebollino"],
    pasos: [
      "Limpia bien los puerros y córtalos en rodajas. Pela y trocea las patatas y la cebolla.",
      "Sofríe la cebolla y los puerros en aceite a fuego suave 10 minutos sin que cojan color.",
      "Añade las patatas y el caldo. Cocina 20 minutos hasta que las patatas estén tiernas.",
      "Tritura muy bien con la batidora. Añade la nata, sal al gusto y vuelve a triturar.",
      "Cuela para obtener una crema muy fina. Refrigera mínimo 2 horas. Sirve con cebollino picado."
    ],
    consejo: "Debe servirse muy fría. Si está demasiado espesa al enfriar, añade un poco de leche fría y remueve bien."
  },
  "Dorada a la sal con ensalada verde": {
    tiempo: "40 min",
    ingredientes: ["2 doradas de unos 500g cada una (limpias)", "2 kg de sal gorda", "2 claras de huevo", "Lechuga, pepino, rábanos para la ensalada", "Aceite de oliva, limón, sal fina"],
    pasos: [
      "Mezcla la sal gorda con las claras de huevo hasta que parezca arena mojada.",
      "Pon una capa de sal de 1 cm en la fuente. Coloca las doradas encima y cúbrelas completamente con el resto de la sal.",
      "Hornea a 200°C durante 25-30 minutos. La sal debe quedar dura como una costra.",
      "Rompe la costra en la mesa. Retira la sal con cuidado, la piel sale con ella. Sirve los lomos limpios.",
      "Acompaña con ensalada verde aliñada con aceite y limón."
    ],
    consejo: "Pide en la pescadería que te las limpien pero que dejen las escamas: protegen la carne durante la cocción."
  },
  "Gazpacho de remolacha": {
    tiempo: "15 min + 1h frío",
    ingredientes: ["300g de remolacha cocida", "400g de tomates maduros", "1/2 pepino", "1 diente de ajo", "50 ml de aceite de oliva", "2 cucharadas de vinagre de jerez, sal"],
    pasos: [
      "Trocea la remolacha, los tomates y el pepino pelado.",
      "Tritura todo junto con el ajo, el aceite, el vinagre y la sal.",
      "Añade agua fría hasta la consistencia deseada. Tritura de nuevo.",
      "Cuela si quieres una textura más fina. Refrigera al menos 1 hora.",
      "Sirve con un chorrito de aceite y unas semillas de sésamo si tienes."
    ],
    consejo: "El color es espectacular. Puedes usar remolacha ya cocida de bote para ahorrar tiempo, escúrrela bien."
  },
  "Croquetas de jamón caseras con tomate cherry": {
    tiempo: "1h 30 min + reposo",
    ingredientes: ["100g de jamón serrano picado fino", "80g de mantequilla", "120g de harina", "700ml de leche entera", "Pan rallado, 2 huevos, sal, nuez moscada, aceite para freír"],
    pasos: [
      "Derrite la mantequilla en una sartén. Añade el jamón y saltea 1 minuto. Incorpora la harina y cocina 2 minutos removiendo para tostarla.",
      "Añade la leche caliente poco a poco sin parar de remover con varillas. Cocina a fuego medio 10-15 minutos hasta que la bechamel se despegue de las paredes. Salpimenta con nuez moscada.",
      "Vierte en una fuente, tapa con papel film tocando la superficie y deja enfriar. Mete en nevera mínimo 2 horas (mejor toda la noche).",
      "Forma las croquetas con dos cucharas o con las manos. Pasa por huevo batido y pan rallado.",
      "Fríe en aceite abundante bien caliente hasta que estén doradas. Escurre en papel de cocina."
    ],
    consejo: "La masa fría es más fácil de manejar. Si se te pegan en las manos, mójatelas con agua fría."
  },
  "Paella de verduras con alcachofas y judías": {
    tiempo: "45 min",
    ingredientes: ["400g de arroz bomba", "4 alcachofas frescas", "200g de judías verdes planas", "1 tomate maduro rallado", "1 pimiento rojo", "Azafrán, pimentón dulce, aceite, sal", "1.2L de caldo de verduras caliente"],
    pasos: [
      "Limpia las alcachofas quitando las hojas duras hasta el corazón. Córtalas en cuartos. Trocea las judías.",
      "Sofríe las verduras en aceite en la paella a fuego medio 10 minutos. Añade el pimiento troceado.",
      "Añade el tomate rallado y cocina 5 minutos. Incorpora el pimentón (fuera del fuego para que no se queme) y enseguida el arroz.",
      "Sofríe el arroz 2 minutos. Añade el caldo caliente con el azafrán disuelto. Distribuye todo bien y no remuevas más.",
      "Cocina a fuego vivo 8 min, luego baja a fuego medio 8 min más. Deja reposar tapada con papel de aluminio 5 minutos."
    ],
    consejo: "El socarrat (el arroz tostado del fondo) se consigue subiendo el fuego al máximo los últimos 2 minutos. Escucha el chisporroteo."
  },
  "Contramuslos de pollo al ajillo": {
    tiempo: "35 min",
    ingredientes: ["8 contramuslos de pollo", "8 dientes de ajo", "150ml de vino blanco", "Perejil fresco", "Aceite de oliva, sal, pimienta, guindilla opcional"],
    pasos: [
      "Salpimienta los contramuslos. Dóralos en aceite a fuego medio-alto por todos lados hasta que estén bien dorados (unos 10 min). Retira y reserva.",
      "En el mismo aceite, fríe los ajos laminados a fuego medio hasta que empiecen a dorarse.",
      "Incorpora el pollo de nuevo. Añade el vino blanco y sube el fuego para que evapore el alcohol 2 minutos.",
      "Baja el fuego, tapa y cocina 20 minutos hasta que el pollo esté tierno y la salsa reducida.",
      "Espolvorea perejil picado antes de servir."
    ],
    consejo: "Los contramuslos quedan mucho más jugosos que las pechugas para este tipo de guiso. No escatimes con el ajo."
  },
  "Tarta de queso casera con frutos rojos": {
    tiempo: "1h + 4h nevera",
    ingredientes: ["400g de queso crema (Philadelphia)", "200ml de nata para montar", "3 huevos", "120g de azúcar", "20g de harina o maizena", "Frutos rojos frescos (fresas, frambuesas)"],
    pasos: [
      "Bate el queso crema con el azúcar hasta que esté cremoso. Añade los huevos uno a uno.",
      "Incorpora la nata y la harina tamizada. Mezcla hasta que esté homogéneo.",
      "Vierte en un molde de 20 cm forrado con papel de hornear.",
      "Hornea a 200°C durante 35-40 minutos. Debe quedar dorada por fuera y ligeramente temblorosa en el centro.",
      "Deja enfriar completamente y mete en nevera al menos 4 horas. Sirve con frutos rojos."

    consejo: "No te preocupes si se agrieta: es señal de que está bien hecha al estilo de La Viña. Es parte de su encanto."
  },
  "Crema de calabacín fría con albahaca": {
    tiempo: "30 min + 1h frío",
    ingredientes: ["4 calabacines medianos", "1 cebolla", "2 dientes de ajo", "200ml de nata o leche", "Caldo de verduras", "Albahaca fresca, aceite, sal"],
    pasos: [
      "Sofríe la cebolla y el ajo en aceite 5 minutos. Añade el calabacín troceado y cocina 10 minutos.",
      "Cubre con caldo, lleva a ebullición y cocina 15 minutos.",
      "Tritura con la nata y la albahaca hasta obtener una crema muy fina. Salpimenta.",
      "Refrigera al menos 1 hora. Sirve con un chorrito de aceite y una hoja de albahaca."
    ],
    consejo: "Para un color verde más intenso, añade las hojas de albahaca justo antes de triturar, sin cocerlas."

  "Albóndigas en salsa de tomate fresco": {
    tiempo: "50 min",
    ingredientes: ["500g de carne picada mixta (cerdo y ternera)", "1 huevo, 2 dientes de ajo, perejil, pan rallado", "700g de tomates maduros", "1 cebolla, 1 zanahoria", "Aceite, sal, azúcar, laurel"],
    pasos: [
      "Mezcla la carne con el huevo, ajo picado, perejil, sal y 2 cucharadas de pan rallado. Forma albóndigas del tamaño de una nuez.",

    consejo: "Mójate las manos con agua para formar las albóndigas: evita que se peguen y quedan más redondas."

  "Ensalada de rúcula, nueces y pera": {
    tiempo: "10 min",
    ingredientes: ["200g de rúcula", "2 peras conferencia", "60g de nueces", "60g de queso parmesano o manchego curado", "Aceite de oliva, vinagre balsámico, sal"],
    pasos: [

      "Dispón la rúcula en la fuente. Coloca las peras encima.",
      "Añade las nueces y el queso en lascas.",
      "Aliña con aceite, vinagre balsámico y una pizca de sal justo antes de servir."

    consejo: "Si la rúcula es muy amarga, mézclala con un poco de canónigos o lechuga baby para suavizarla."

  "Revuelto de espárragos y gambas": {
    tiempo: "15 min",
    ingredientes: ["6 huevos", "200g de gambas peladas", "1 manojo de espárragos trigueros", "2 dientes de ajo", "Aceite de oliva, sal, pimienta"],
    pasos: [

  "Gazpacho de sandía": {

    ingredientes: ["600g de sandía sin pepitas", "400g de tomates maduros", "1/2 pimiento rojo", "1 diente de ajo pequeño", "50ml de aceite de oliva", "Vinagre de jerez, sal"],

  "Lubina al vapor con verduras juliana": {

  "Arroz a la cubana con huevo frito y plátano": {

  "Chuletas de cordero a la brasa con pimientos": {
    tiempo: "20 min",

  "Crema de zanahoria con jengibre": {
    tiempo: "35 min",
    ingredientes: ["700g de zanahorias", "1 cebolla", "1 trozo de jengibre fresco (2 cm)", "400ml de caldo de verduras", "200ml de leche de coco o nata", "Aceite, sal, cilantro o perejil"],

  "Sardinas al horno con limón y perejil": {
    tiempo: "25 min",

  "Ensalada de garbanzos con verduras asadas": {
    tiempo: "40 min",
    ingredientes: ["400g de garbanzos cocidos (bote)", "1 pimiento rojo, 1 calabacín, 1 cebolla morada", "200g de tomates cherry", "Aceite, vinagre, comino, sal, perejil"],
    pasos: [

  "Pollo guisado con patatas y pimientos": {
    tiempo: "55 min",
    ingredientes: ["1 pollo troceado (1.2 kg)", "600g de patatas", "2 pimientos (1 rojo, 1 verde)", "1 cebolla, 4 dientes de ajo", "150ml de vino blanco, tomate, pimentón, laurel, aceite, sal"],

  "Fritada de verduras con huevos pochados": {
    tiempo: "35 min",
    ingredientes: ["1 calabacín, 1 pimiento verde, 1 cebolla, 2 tomates", "4 huevos", "2 dientes de ajo", "Aceite de oliva, sal, pimentón, vinagre blanco"],
    pasos: [
      "Corta todas las verduras en trozos similares. Sofríe la cebolla y el ajo en aceite 5 min.",

  "Sopa de fideos con almejas": {
    tiempo: "30 min",
    ingredientes: ["500g de almejas frescas", "150g de fideos finos (nº 2)", "1 cebolla, 2 dientes de ajo, 1 tomate", "100ml de vino blanco", "Caldo de pescado o agua, perejil, aceite, sal"],

  },
  "Bacalao al pil-pil con pimientos del piquillo": {
    tiempo: "40 min",
    ingredientes: ["600g de bacalao desalado en lomos", "6 dientes de ajo", "1 guindilla", "200ml de aceite de oliva suave", "Pimientos del piquillo asados"],
    pasos: [
      "Seca bien el bacalao. Pon el aceite con los ajos laminados y la guindilla en una cazuela de barro a fuego suave. Confita los ajos 10 min hasta que estén dorados. Retira ajos y guindilla.",

    consejo: "El pil-pil se consigue con movimiento constante y temperatura baja. Si la salsa no liga, enfría un poco el aceite y sigue moviendo."

  "Pimientos asados con anchoas": {

    consejo: "El jugo que sueltan los pimientos al pelarlos es oro: guárdalo y úsalo como parte del aliño."

  "Fideuà de marisco": {
    tiempo: "40 min",
    ingredientes: ["400g de fideos gruesos nº 4", "400g de gambas y cigalas", "300g de mejillones", "1 sepia, 1 cebolla, 2 tomates maduros", "Azafrán, pimentón, caldo de pescado, aceite, sal"],

  "Ensalada de langostinos y aguacate": {
    tiempo: "20 min",

    pasos: [

  "Pulpo a la gallega con patatas cocidas": {
    tiempo: "1h 15min",

  "Ajoblanco malagueño con uvas": {
    tiempo: "20 min + 1h frío",
    ingredientes: ["200g de almendras crudas peladas", "150g de pan del día anterior", "2 dientes de ajo", "150ml de aceite de oliva suave", "3 cucharadas de vinagre de jerez", "Agua fría, sal, uvas blancas para servir"],

  "Ternera estofada con zanahorias y guisantes": {
    tiempo: "1h 30min",
    ingredientes: ["800g de ternera para guisar (morcillo o aguja)", "3 zanahorias", "200g de guisantes frescos o congelados", "1 cebolla, 3 dientes de ajo", "150ml de vino tinto, caldo, laurel, tomillo, aceite, sal"],

  "Ensalada caprese con albahaca fresca": {

  "Crema de puerros y patata": {

  "Arroz con verduras al azafrán": {

  "Lomo de cerdo en salsa de champiñones": {
    tiempo: "40 min",

  "Huevos a la flamenca con tomate y chorizo": {

  "Sopa castellana con huevo y pan": {

  "Rape a la marinera con almejas": {

  "Gazpacho de tomate amarillo": {

  "Merluza en salsa verde con almejas": {

  "Paella valenciana tradicional": {

  "Crema de tomate asado con albahaca": {

  "Calamares a la romana con alioli y ensalada": {

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let state = { week: 0, dayIdx: null, view: 'grid', modal: null };

function render() {
  document.getElementById('app').innerHTML = buildApp();
  bindEvents();
}

// ═══════════════════════════════════════════════════════
//  BUILD HTML
// ═══════════════════════════════════════════════════════
function buildApp() {
  return `
    <div class="header">
      <div class="header-eyebrow">Menú de temporada · Verano</div>
      <h1>Mesa Familiar</h1>
      <div class="header-sub">4 personas · 3 adultos + 1 niño · Lunes a Sábado</div>
      <div class="header-hint">Toca un plato para ver su receta 📖</div>
    </div>
    ${buildTabs()}
    ${state.view === 'grid' ? buildGrid() : buildDetail()}
    <div class="footer">Cocina de mercado · Productos frescos · Sin preparados industriales</div>
    ${state.modal ? buildModal() : ''}
  `;
}

function buildTabs() {
  return `<div class="week-tabs">
    ${weeks.map((w,i) => `<button class="week-tab ${i===state.week?'active':''}" data-week="${i}">${w.label}</button>`).join('')}
  </div>`;
}

function buildGrid() {
  const days = weeks[state.week].days;
  return `<div class="grid">
    ${days.map((d,i) => `
      <button class="day-card" data-day="${i}" style="border-color:var(--${d.color})22">
        <span class="day-badge" style="background:var(--${d.color})">${d.day}</span>
        <div class="card-label">Comida</div>
        <div class="card-dish">${d.comida.primero}</div>
        <div class="card-label">Cena</div>
        <div class="card-dish">${d.cena.primero}</div>
        <div class="card-arrow" style="color:var(--${d.color})">Ver menú completo →</div>
      </button>`).join('')}
  </div>`;
}

function buildDetail() {
  const d = weeks[state.week].days[state.dayIdx];
  const prev = state.dayIdx > 0 ? weeks[state.week].days[state.dayIdx-1].day : null;
  const next = state.dayIdx < 5 ? weeks[state.week].days[state.dayIdx+1].day : null;
  return `<div class="detail">
    <button class="back-btn" id="backBtn">← Volver</button>
    <div><span class="day-title-badge" style="background:var(--${d.color})">${d.day} · ${weeks[state.week].label}</span></div>
    <div class="detail-hint">👆 Toca un plato para ver su receta paso a paso</div>
    ${buildMealBlock('🍽️ COMIDA', d.comida, '#F0F8EC')}
    ${buildMealBlock('🌙 CENA', d.cena, '#EDF2F8')}
    <div class="day-nav">
      ${prev ? `<button class="day-nav-btn" id="prevDay">← ${prev}</button>` : ''}
      ${next ? `<button class="day-nav-btn" id="nextDay">${next} →</button>` : ''}
    </div>
  </div>`;
}

function buildMealBlock(label, meal, bg) {
  const dishes = [
    { role: 'Primer plato', name: meal.primero, emoji: '🥗' },
    { role: 'Segundo plato', name: meal.segundo, emoji: '🍳' },
    { role: 'Postre', name: meal.postre, emoji: '🍑' }
  ];
  return `<div class="meal-block" style="background:${bg}">
    <div class="meal-block-label">${label}</div>
    ${dishes.map(dish => `
      <button class="dish-btn" data-dish="${encodeURIComponent(dish.name)}">
        <span class="dish-emoji">${dish.emoji}</span>
        <div class="dish-info">
          <div class="dish-role">${dish.role}</div>
          <div class="dish-name">${dish.name}</div>
        </div>
        <span class="dish-icon">📖</span>
      </button>`).join('')}
  </div>`;
}

function buildModal() {
  const dish = state.modal;
  const recipe = RECETAS[dish];
  return `<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-sheet">
      <div class="modal-handle-wrap"><div class="modal-handle"></div></div>
      <div class="modal-eyebrow">Receta · 4 personas</div>
      <div class="modal-title">${dish}</div>
      ${recipe ? `
        <div class="modal-time">⏱ ${recipe.tiempo}</div>
        <div class="section-label">🛒 Ingredientes</div>
        <div class="ingredient-list">
          ${recipe.ingredientes.map(i => `<div class="ingredient-item"><span class="ingredient-dot">·</span>${i}</div>`).join('')}
        </div>
        <div class="section-label">📋 Elaboración</div>
        <div class="steps-list">
          ${recipe.pasos.map((p,i) => `<div class="step-item"><span class="step-num">${i+1}</span><div class="step-text">${p}</div></div>`).join('')}
        </div>
        ${recipe.consejo ? `<div class="tip-box"><div class="tip-label">💡 Consejo</div><div class="tip-text">${recipe.consejo}</div></div>` : ''}
      ` : `<div style="padding:30px 0;text-align:center;font-family:sans-serif;color:var(--muted)">Sirve este plato con los ingredientes frescos que prefieras 🌿</div>`}
      <button class="modal-close" id="modalClose">Cerrar</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════
function bindEvents() {
  // Week tabs
  document.querySelectorAll('.week-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.week = +btn.dataset.week;
      state.view = 'grid';
      state.dayIdx = null;
      render();
    });
  });

  // Day cards
  document.querySelectorAll('.day-card').forEach(btn => {
    btn.addEventListener('click', () => {
      state.dayIdx = +btn.dataset.day;
      state.view = 'detail';
      render();
      window.scrollTo(0,0);
    });
  });

  // Back button
  const back = document.getElementById('backBtn');
  if (back) back.addEventListener('click', () => { state.view = 'grid'; state.dayIdx = null; render(); window.scrollTo(0,0); });

  // Day nav
  const prev = document.getElementById('prevDay');
  if (prev) prev.addEventListener('click', () => { state.dayIdx--; render(); window.scrollTo(0,0); });
  const next = document.getElementById('nextDay');
  if (next) next.addEventListener('click', () => { state.dayIdx++; render(); window.scrollTo(0,0); });

  // Dish buttons
  document.querySelectorAll('.dish-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.modal = decodeURIComponent(btn.dataset.dish);
      render();
    });
  });

  // Modal close
  const modalClose = document.getElementById('modalClose');
  if (modalClose) modalClose.addEventListener('click', () => { state.modal = null; render(); });
  const backdrop = document.getElementById('modalBackdrop');
  if (backdrop) backdrop.addEventListener('click', e => { if (e.target === backdrop) { state.modal = null; render(); } });
}

// ═══════════════════════════════════════════════════════
//  SERVICE WORKER
// ═══════════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// Init
render();
</script>
